name: test
on: [workflow_dispatch]
jobs:
  boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Unzip project
        run: unzip -q realsnow-fabric-26.1.2-source.zip
      - name: Boot a real 26.1.2 Fabric server with the mod
        working-directory: snowmod
        run: |
          chmod +x gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          ./gradlew runServer --console=plain > ../server.log 2>&1 &
          for i in $(seq 1 120); do
            if grep -q 'Done (' ../server.log; then break; fi
            if grep -qE 'BUILD FAILED|Exception in thread "main"' ../server.log; then break; fi
            sleep 5
          done
          pkill -f KnotServer || true
          pkill -f gradle || true
      - name: Check results
        run: |
          tail -n 60 server.log
          grep -q 'Done (' server.log || { echo "FAIL: server did not finish starting"; exit 1; }
          grep -q 'Real Snow loaded' server.log || { echo "FAIL: mod did not load"; exit 1; }
          if grep -qE 'Could not execute entrypoint|Mixin apply failed|NoSuchMethodError|NoSuchFieldError|ClassNotFoundException' server.log; then echo "FAIL: mod errors found"; exit 1; fi
          echo "PASS: server booted with Real Snow"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: server.log
